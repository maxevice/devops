name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "lab3" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master", "lab1" ]

jobs:
  lint:
    name: Code Analysis (Linting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mywebapp_db
          POSTGRES_USER: app
          POSTGRES_PASSWORD: 12345678
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Update config for CI
        run: sed -i 's/@db:5432/@localhost:5432/' config.json
      - name: Run tests with pytest
        run: |
          python migrate.py
          pytest --cov=. --cov-report=xml --cov-fail-under=40 test_main.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long,prefix=sha-
            type=raw,value=stable,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  deploy-and-verify:
    name: Deploy and Verify
    runs-on: self-hosted
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Target Node
        run: |
          echo "1. Копіювання systemd-unit на цільову машину..."
          scp -o StrictHostKeyChecking=no mywebapp.service student@192.168.56.102:/tmp/
          
          echo "2. Переміщення unit-файлу та перезавантаження systemd..."
          ssh -o StrictHostKeyChecking=no student@192.168.56.102 "sudo mv /tmp/mywebapp.service /etc/systemd/system/ && sudo systemctl daemon-reload"
          
          echo "3. Завантаження актуального Docker-образу..."
          ssh -o StrictHostKeyChecking=no student@192.168.56.102 "sudo docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          ssh -o StrictHostKeyChecking=no student@192.168.56.102 "sudo docker tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} ghcr.io/${{ github.repository }}:stable"
          
          echo "4. Перезапуск застосунку..."
          ssh -o StrictHostKeyChecking=no student@192.168.56.102 "sudo systemctl restart mywebapp"

      - name: Verify Deployment
        run: |
          echo "Чекаємо 5 секунд для ініціалізації контейнера..."
          sleep 5
          
          echo "Запуск процесу верифікації..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://192.168.56.102/health/alive)
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ ВЕРИФІКАЦІЯ УСПІШНА! Nginx працює, сервіс доступний. Код: $HTTP_STATUS"
          else
            echo "❌ ПОМИЛКА ВЕРИФІКАЦІЇ! Сервіс недоступний. Код: $HTTP_STATUS"
            exit 1
          fi