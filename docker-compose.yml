version: '3.8'

services:
  db:
    image: postgres:16
    container_name: simple_inventory_db
    restart: always
    environment:
      POSTGRES_DB: mywebapp_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: 12345678
    volumes:
      - db_data:/var/lib/postgresql/data 
    networks:
      - mywebapp_net

  web:
    build: .
    container_name: simple_inventory_web
    restart: always
    depends_on:
      - db
    volumes:
      - ./config.json:/etc/mywebapp/config.json
    networks:
      - mywebapp_net

  nginx:
    image: nginx:1.24-alpine
    container_name: simple_inventory_nginx
    restart: always
    ports:
      - "80:80"  
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - mywebapp_net

networks:
  mywebapp_net:
    driver: bridge

volumes:
  db_data:
